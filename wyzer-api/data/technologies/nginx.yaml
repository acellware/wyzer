slug: nginx
name: "NGINX"
category: networking
vendor: "F5, Inc."
is_managed_available: false
logo_url: /logos/nginx.svg

config_questions:
  - signal_key: tls_enforced
    question: "Is TLS enforced for all incoming connections (HTTP redirected to HTTPS)?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 1
  - signal_key: tls_version
    question: "What is the minimum TLS version configured?"
    input_type: radio
    applies_to_modes: [self-hosted, on-prem]
    options:
      - { value: tls10, label: "TLS 1.0 (insecure)" }
      - { value: tls11, label: "TLS 1.1 (insecure)" }
      - { value: tls12, label: "TLS 1.2" }
      - { value: tls13, label: "TLS 1.3 (recommended)" }
    order_index: 2
  - signal_key: security_headers
    question: "Are security headers configured (HSTS, X-Frame-Options, CSP, X-Content-Type-Options)?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 3
  - signal_key: rate_limiting
    question: "Is rate limiting configured to prevent brute force and DDoS?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 4
  - signal_key: access_logging
    question: "Is access logging enabled and shipped to a centralised log store?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 5
  - signal_key: waf_enabled
    question: "Is a Web Application Firewall (ModSecurity/NGINX App Protect) enabled?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 6
  - signal_key: worker_processes_isolated
    question: "Does NGINX run as a non-root user with a dedicated system account?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.6"
      title: "Logical Access - External Threats"
      severity: HIGH
      description: "Logical access security measures restrict access from outside the system boundary."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: tls_version, op: "in", value: ["tls12", "tls13"] }
    evidence: "TLS enforcement with minimum TLS 1.2 protects data in transit from external interception."
    remediation: "Set ssl_protocols TLSv1.2 TLSv1.3; add return 301 https redirect for HTTP requests."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.2"
      title: "Evaluates Security Events"
      severity: MEDIUM
      description: "The entity monitors system components and the operation of those controls on an ongoing basis."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: access_logging, op: eq, value: "yes" }
    evidence: "NGINX access logs provide audit evidence for all HTTP requests processed by the system."
    remediation: "Enable access_log with a structured log format; ship logs to centralised SIEM within 24 hours."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: tls_version, op: "in", value: ["tls12", "tls13"] }
    evidence: "NGINX TLS termination with TLS 1.2+ satisfies in-transit data encryption requirements."
    remediation: "Configure ssl_ciphers with ECDHE suites only; use ssl_session_tickets off for perfect forward secrecy."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.22"
      title: "Segregation of Networks"
      severity: MEDIUM
      description: "Networks shall be segregated in groups of information services according to information security requirements."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: rate_limiting, op: eq, value: "yes" }
        - { signal: waf_enabled, op: eq, value: "yes" }
    evidence: "Rate limiting and WAF provide network-level traffic controls protecting internal services."
    remediation: "Configure limit_req_zone with appropriate burst; enable ModSecurity with OWASP CRS ruleset."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical measures to ensure security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: security_headers, op: eq, value: "yes" }
    evidence: "TLS and security headers protect personal data processed by NGINX from interception and injection attacks."
    remediation: "Enforce TLS; add HSTS (max-age 31536000); set X-Content-Type-Options: nosniff; configure CSP."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "Req.6.4"
      title: "Web-Facing Applications Protected"
      severity: HIGH
      description: "Web-facing applications are protected against known attacks including those in OWASP Top 10."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: waf_enabled, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "WAF and TLS for all cardholder data environment web traffic satisfy PCI-DSS 6.4 requirements."
    remediation: "Enable ModSecurity with OWASP CRS or NGINX App Protect; enforce TLS 1.2+ for all CDE requests."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(e)(1)"
      title: "Transmission Security"
      severity: HIGH
      description: "Implement technical security measures to guard against unauthorised access to ePHI transmitted over networks."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: tls_version, op: "in", value: ["tls12", "tls13"] }
    evidence: "TLS 1.2+ enforced on all connections protects ePHI in transit between clients and NGINX."
    remediation: "Configure ssl_protocols TLSv1.2 TLSv1.3; add HSTS header; reject plaintext HTTP requests."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: access_logging, op: eq, value: "yes" }
    evidence: "TLS encryption and access logging safeguard personal data of Nigerian data subjects in transit."
    remediation: "Enforce HTTPS for all requests; enable structured access logging with client IP and request details."
