slug: hashicorp-vault
name: "HashiCorp Vault"
category: secrets-management
vendor: "HashiCorp"
is_managed_available: true
logo_url: /logos/hashicorp-vault.svg

config_questions:
  - signal_key: tls_enforced
    question: "Is TLS enforced for all Vault API communications?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 1
  - signal_key: audit_logging
    question: "Is Vault audit logging enabled (file or syslog backend)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 2
  - signal_key: auto_unseal
    question: "Is auto-unseal configured (AWS KMS, GCP KMS, or Azure Key Vault)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 3
  - signal_key: auth_method
    question: "What authentication method is used by applications?"
    input_type: radio
    applies_to_modes: [managed, self-hosted, on-prem]
    options:
      - { value: token, label: "Static Token (not recommended)" }
      - { value: approle, label: "AppRole" }
      - { value: cloud_iam, label: "Cloud IAM (AWS/GCP/Azure)" }
      - { value: kubernetes, label: "Kubernetes Auth" }
    order_index: 4
  - signal_key: lease_ttl_short
    question: "Are secret leases and tokens configured with short TTLs (< 1 hour for dynamic secrets)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 5
  - signal_key: ha_enabled
    question: "Is Vault deployed in HA mode with at least 3 nodes?"
    input_type: toggle
    applies_to_modes: [self-hosted, on-prem]
    order_index: 6
  - signal_key: policy_least_privilege
    question: "Are Vault policies scoped to the minimum required paths per application?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 7
  - signal_key: secret_rotation
    question: "Are dynamic secrets or automated rotation used instead of static credentials?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 8

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical and Physical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security software and architectures over protected information assets."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: policy_least_privilege, op: eq, value: "yes" }
        - { signal: auth_method, op: "in", value: ["approle", "cloud_iam", "kubernetes"] }
    evidence: "Least-privilege Vault policies and non-token auth methods ensure only authorised workloads access secrets."
    remediation: "Define narrow Vault policies per app service; use AppRole or cloud IAM auth instead of root/static tokens."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.2"
      title: "Evaluates Security Events"
      severity: HIGH
      description: "The entity monitors system components and the operation of those controls on an ongoing basis."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: audit_logging, op: eq, value: "yes" }
    evidence: "Vault audit log records every request and response, providing complete traceability of secret access."
    remediation: "Enable at least one audit device (file or syslog); ship logs to SIEM; alert on access denied events."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: auto_unseal, op: eq, value: "yes" }
    evidence: "TLS for all API comms and cloud KMS-backed auto-unseal ensure cryptographic key material is protected."
    remediation: "Configure listener with tls_cert_file and tls_key_file; configure seal stanza with KMS provider."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.3"
      title: "Information Access Restriction"
      severity: HIGH
      description: "Access to information and application system functions shall be restricted in accordance with the access control policy."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: policy_least_privilege, op: eq, value: "yes" }
        - { signal: lease_ttl_short, op: eq, value: "yes" }
    evidence: "Scoped policies and short-lived dynamic secrets minimise exposure window per the access control policy."
    remediation: "Set max_lease_ttl=1h and default_lease_ttl=1h on secret mounts; regularly audit policy breadth."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical measures to ensure security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: audit_logging, op: eq, value: "yes" }
        - { signal: secret_rotation, op: eq, value: "yes" }
    evidence: "TLS, complete audit trail, and dynamic secret rotation implement GDPR technical security measures."
    remediation: "Enable Vault audit log; use database dynamic secrets for services handling personal data; enforce TLS."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "Req.8.3"
      title: "User Authentication for CDE"
      severity: HIGH
      description: "All individual non-consumer user accounts and related authentication processes are managed."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: auth_method, op: "in", value: ["approle", "cloud_iam", "kubernetes"] }
        - { signal: lease_ttl_short, op: eq, value: "yes" }
        - { signal: secret_rotation, op: eq, value: "yes" }
    evidence: "Non-static auth methods and dynamic secrets with short TTLs satisfy PCI-DSS credential management requirements."
    remediation: "Use dynamic database credentials for CDE services; set TTL < 1 hour; rotate static credentials monthly."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(2)(i)"
      title: "Unique User Identification"
      severity: HIGH
      description: "Assign a unique name and/or number for identifying and tracking user identity."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: auth_method, op: "in", value: ["approle", "cloud_iam", "kubernetes"] }
        - { signal: audit_logging, op: eq, value: "yes" }
    evidence: "Named AppRole/IAM auth binds secret access to specific service identities; audit log traces every access."
    remediation: "Use unique AppRole IDs per service; enable audit logging to correlate secret access to service identities."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: policy_least_privilege, op: eq, value: "yes" }
    evidence: "TLS and scoped access policies protect credentials that grant access to personal data of Nigerian residents."
    remediation: "Enforce TLS on Vault listener; define narrow policies scoped to only the paths needed per service."
