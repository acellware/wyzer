slug: flyio
name: "Fly.io"
category: cloud-provider
vendor: "Fly.io, Inc."
is_managed_available: true
logo_url: /logos/flyio.svg

config_questions:
  - signal_key: private_networking
    question: "Are services communicating over Fly private networking (6PN) rather than public internet where possible?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: secrets_managed
    question: "Are all application secrets stored as Fly secrets (not hardcoded in fly.toml or Docker images)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 2
  - signal_key: tls_enforced
    question: "Is HTTPS enforced for all public-facing Fly app URLs (auto-TLS via Let's Encrypt)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: mfa_enforced
    question: "Is MFA enforced for all Fly.io organisation member accounts?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: token_scoped
    question: "Are Fly API tokens scoped to specific apps or read-only access rather than organisation-wide access?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: health_checks
    question: "Are health checks and auto-restart policies configured for all production machines?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6
  - signal_key: backup_strategy
    question: "Is a backup/snapshot strategy in place for any persistent Fly Volumes storing critical data?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security measures to protect information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: mfa_enforced, op: eq, value: "yes" }
        - { signal: token_scoped, op: eq, value: "yes" }
    evidence: "MFA and scoped API tokens ensure Fly.io infrastructure is only accessible to authorised team members and services."
    remediation: "Enable MFA for all org members; create per-app deploy tokens; revoke personal tokens after automation setup."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.7"
      title: "Restricts Transmission of Confidential Information"
      severity: MEDIUM
      description: "The entity encrypts confidential information in transit."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: private_networking, op: eq, value: "yes" }
    evidence: "Auto-TLS on public endpoints and 6PN private networking protect data in transit between services."
    remediation: "Confirm auto-TLS is active for all apps; use `fly-local-6pn` for inter-app communication."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.9"
      title: "Configuration Management"
      severity: MEDIUM
      description: "Configurations of hardware, software, services, and networks shall be established, documented, monitored, and reviewed."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_managed, op: eq, value: "yes" }
        - { signal: health_checks, op: eq, value: "yes" }
    evidence: "Fly secrets management and health checks ensure application configuration is secure and availability is maintained."
    remediation: "Use `flyctl secrets set` for all configuration; remove secrets from fly.toml; configure tcp_checks per app."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "4.2.1"
      title: "Strong Cryptography in Transit"
      severity: HIGH
      description: "Strong cryptography is used to safeguard sensitive authentication data during transmission."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: private_networking, op: eq, value: "yes" }
    evidence: "Auto-TLS public endpoints and private 6PN networking protect cardholder data in CDE workloads on Fly.io."
    remediation: "Enforce HTTPS only; route CDE service-to-service traffic via 6PN; document Fly.io scope in PCI SAQ."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: MEDIUM
      description: "Technical measures shall protect personal data from unauthorised access."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: secrets_managed, op: eq, value: "yes" }
    evidence: "TLS and Fly secrets protect personal data credentials and transit data for GDPR-applicable workloads."
    remediation: "Enable auto-TLS; use Fly secrets for DB credentials; document Fly.io as a data processor in GDPR records."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(e)(1)"
      title: "Transmission Security"
      severity: HIGH
      description: "Guard against unauthorised access to ePHI being transmitted."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: private_networking, op: eq, value: "yes" }
    evidence: "Auto-TLS and 6PN private networking protect ePHI transmitted between Fly.io applications."
    remediation: "Confirm auto-TLS for patient-facing apps; route ePHI inter-app calls via private 6PN; confirm Fly.io HIPAA BAA."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: MEDIUM
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: secrets_managed, op: eq, value: "yes" }
    evidence: "TLS and managed secrets protect personal data of Nigerian residents processed by applications on Fly.io."
    remediation: "Enable auto-TLS; store all credentials as Fly secrets; document Fly.io in data processing agreements."
