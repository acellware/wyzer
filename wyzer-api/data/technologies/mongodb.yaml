slug: mongodb
name: MongoDB
category: database
vendor: "MongoDB, Inc."
is_managed_available: true
logo_url: /logos/mongodb.svg

config_questions:
  - signal_key: encryption_at_rest
    question: "Is encryption at rest enabled (Encrypted Storage Engine or Atlas Encryption)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 1
  - signal_key: tls_enforced
    question: "Is TLS enforced for all client and replica-set communications?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 2
  - signal_key: auth_enabled
    question: "Is authentication enabled (SCRAM, x.509, or LDAP)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 3
  - signal_key: rbac_enabled
    question: "Are role-based access controls configured with least-privilege roles?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 4
  - signal_key: publicly_accessible
    question: "Is the database reachable from the public internet?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 5
  - signal_key: audit_logging
    question: "Is MongoDB audit logging enabled?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 6
  - signal_key: backup_enabled
    question: "Are automated backups enabled?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 7
  - signal_key: backup_retention
    question: "What is your backup retention period?"
    input_type: radio
    applies_to_modes: [managed, self-hosted, on-prem]
    options:
      - { value: lt_7d, label: "Less than 7 days" }
      - { value: 7_30d, label: "7 to 30 days" }
      - { value: 30_90d, label: "30 to 90 days" }
      - { value: gt_90d, label: "90+ days" }
    order_index: 8
  - signal_key: field_level_encryption
    question: "Is Client-Side Field Level Encryption used for sensitive fields?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 9

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical and Physical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security software and architectures over protected information assets."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: rbac_enabled, op: eq, value: "yes" }
    evidence: "MongoDB authentication and built-in role system enforce access controls on collections and operations."
    remediation: "Enable authentication; assign least-privilege built-in or custom roles per application service user."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.6"
      title: "Logical Access - External Threats"
      severity: HIGH
      description: "Logical access security measures restrict access from outside the system boundary."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: publicly_accessible, op: eq, value: "no" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "Non-public network placement and TLS restrict access to authorised internal systems."
    remediation: "Bind mongod to private interfaces; set net.tls.mode: requireTLS in mongod.conf."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.2"
      title: "Evaluates Security Events"
      severity: MEDIUM
      description: "The entity monitors system components and the operation of those controls on an ongoing basis."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: audit_logging, op: eq, value: "yes" }
    evidence: "MongoDB audit log captures authCheck, authenticate, and DDL operations for compliance evidence."
    remediation: "Enable auditLog with filter for authenticate, createCollection, dropCollection, and find operations."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "Encrypted Storage Engine with AES-256 and TLS for all connections satisfy cryptography requirements."
    remediation: "Enable WiredTiger encrypted storage engine; configure TLS with a valid CA-signed certificate."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.14"
      title: "Redundancy of Information Processing"
      severity: MEDIUM
      description: "Information processing facilities shall be implemented with sufficient redundancy."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: backup_enabled, op: eq, value: "yes" }
        - { signal: backup_retention, op: "in", value: ["7_30d", "30_90d", "gt_90d"] }
    evidence: "Automated backups with sufficient retention provide recovery capability for MongoDB data."
    remediation: "Enable automated backups (mongodump, Atlas backup, or Ops Manager) with at least 7-day retention."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical measures to ensure security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "Encryption, authentication, RBAC, and TLS enforce GDPR Article 32 technical measures for personal data."
    remediation: "Enable encrypted storage, TLS, and role-based access; use field-level encryption for sensitive PII fields."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.25"
      title: "Data Protection by Design and Default"
      severity: MEDIUM
      description: "Implement appropriate technical measures to ensure that only personal data necessary is processed."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: field_level_encryption, op: eq, value: "yes" }
    evidence: "Client-Side Field Level Encryption ensures sensitive PII fields are encrypted before leaving the application."
    remediation: "Implement CSFLE for fields containing PII (e.g. SSN, health data); use automatic encryption with Queryable Encryption."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "Req.3.5"
      title: "Primary Account Number Protection"
      severity: CRITICAL
      description: "Primary account number must be secured wherever stored."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: field_level_encryption, op: eq, value: "yes" }
    evidence: "Storage engine encryption and CSFLE provide layered protection for PAN stored in MongoDB."
    remediation: "Use Queryable Encryption for PAN fields; enable encrypted storage engine; restrict access to CDE roles only."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(2)(iv)"
      title: "Encryption and Decryption"
      severity: HIGH
      description: "Implement a mechanism to encrypt and decrypt electronic protected health information."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "Encrypted storage engine protects ePHI at rest; TLS protects ePHI in transit."
    remediation: "Enable WiredTiger encrypted storage; enforce TLS; use CSFLE for highly sensitive ePHI fields."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: publicly_accessible, op: eq, value: "no" }
    evidence: "Encryption, authentication, and network isolation safeguard personal data of Nigerian data subjects."
    remediation: "Enable encrypted storage engine; require authentication; bind to private network interfaces only."
