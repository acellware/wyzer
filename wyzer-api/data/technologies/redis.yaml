slug: redis
name: Redis
category: cache
vendor: Redis Ltd.
is_managed_available: true
logo_url: /logos/redis.svg

config_questions:
  - signal_key: auth_enabled
    question: "Is authentication (password or ACL) enabled?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 1
  - signal_key: tls_enabled
    question: "Is TLS enabled for client connections?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 2
  - signal_key: network_isolated
    question: "Is Redis accessible only within a private network or VPC?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 3
  - signal_key: persistence_mode
    question: "What persistence mode is enabled?"
    input_type: radio
    applies_to_modes: [managed, self-hosted, on-prem]
    options:
      - { value: none, label: "No persistence (cache only)" }
      - { value: rdb, label: "RDB snapshots" }
      - { value: aof, label: "AOF (append-only file)" }
      - { value: rdb_aof, label: "RDB + AOF" }
    order_index: 4
  - signal_key: stores_pii
    question: "Does Redis store or cache personally identifiable information?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 5
  - signal_key: acl_enabled
    question: "Are ACL rules configured to restrict keyspace access by user?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 6

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical and Physical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security software and architectures over protected information assets."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: acl_enabled, op: eq, value: "yes" }
    evidence: "Redis AUTH and ACL rules restrict access to the keyspace by user and command."
    remediation: "Enable requirepass or ACLs in redis.conf; grant only necessary command permissions per user."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.6"
      title: "Logical Access - External Threats"
      severity: HIGH
      description: "Logical access security measures restrict access from outside the system boundary."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: network_isolated, op: eq, value: "yes" }
        - { signal: tls_enabled, op: eq, value: "yes" }
    evidence: "Redis is isolated within a private network and all connections are encrypted."
    remediation: "Bind Redis to a private IP; enable tls-port and supply cert/key in redis.conf."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.7"
      title: "Restrictions on Information Transmission"
      severity: MEDIUM
      description: "The transmission and movement of information is limited to authorised users."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enabled, op: eq, value: "yes" }
    evidence: "TLS encrypts all data transmitted between Redis clients and the server."
    remediation: "Configure tls-port and tls-cert-file/tls-key-file in redis.conf."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.3"
      title: "Information Access Restriction"
      severity: HIGH
      description: "Access to information and application system functions shall be restricted in accordance with the access control policy."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: auth_enabled, op: eq, value: "yes" }
    evidence: "Redis AUTH with strong credentials prevents unauthorised access."
    remediation: "Set a strong requirepass value; rotate credentials regularly."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enabled, op: eq, value: "yes" }
    evidence: "TLS encrypts all Redis traffic in transit."
    remediation: "Enable TLS on the Redis port and enforce TLS minimum version TLSv1.2."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Technical measures shall protect personal data from unauthorised access."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
    evidence: "TLS and AUTH protect personal data cached in Redis from unauthorised access."
    remediation: "Enable TLS (rediss://); require AUTH; do not cache plaintext PII; set TTLs on all personal data keys."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.5(1)(e)"
      title: "Storage Limitation"
      severity: MEDIUM
      description: "Personal data shall be kept for no longer than is necessary."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: eviction_policy, op: in, value: ["allkeys-lru", "volatile-lru", "volatile-ttl"] }
    evidence: "Key TTLs and eviction policies ensure personal data in Redis is not kept indefinitely."
    remediation: "Set TTLs on all keys holding personal data; configure volatile-ttl eviction; document in GDPR data map."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "4.2.1"
      title: "Strong Cryptography in Transit"
      severity: HIGH
      description: "Strong cryptography is used to safeguard sensitive authentication data during transmission."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
    evidence: "TLS on Redis connections protects any CDE-related session tokens or cached data in transit."
    remediation: "Enforce TLS on all Redis connections; use ACL users instead of shared AUTH password for CDE services."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "7.2.1"
      title: "Access Control - Least Privilege"
      severity: HIGH
      description: "Access to system components is restricted to only those whose job requires it."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: publicly_accessible, op: eq, value: "no" }
    evidence: "Redis AUTH and private network placement restrict access to the CDE Redis instance."
    remediation: "Use Redis ACL; create per-service users with NOKEYS restriction; place Redis in a private subnet."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(e)(1)"
      title: "Transmission Security"
      severity: HIGH
      description: "Guard against unauthorised access to ePHI being transmitted over electronic communications networks."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "TLS on Redis connections protects ePHI session tokens or cached healthcare data in transit."
    remediation: "Enable TLS on Redis; use certificate pinning; never cache raw ePHI values in Redis."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(1)"
      title: "Access Control"
      severity: HIGH
      description: "Implement technical policies and procedures that allow access only to authorised persons."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: publicly_accessible, op: eq, value: "no" }
    evidence: "Redis AUTH and private network access restrict ePHI caching infrastructure to authorised services."
    remediation: "Configure Redis ACL users per microservice; bind Redis to private IP; disable CONFIG and DEBUG commands."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: MEDIUM
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
    evidence: "TLS and authentication protect personal data of Nigerian residents cached in Redis."
    remediation: "Enable TLS and AUTH; set TTLs on Nigerian resident data keys; document Redis in NDPR data processing records."
