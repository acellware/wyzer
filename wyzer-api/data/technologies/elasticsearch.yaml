slug: elasticsearch
name: "Elasticsearch"
category: database
vendor: "Elastic N.V."
is_managed_available: true
logo_url: /logos/elasticsearch.svg

config_questions:
  - signal_key: tls_enforced
    question: "Is TLS enabled for all HTTP and transport (node-to-node) Elasticsearch traffic?"
    input_type: toggle
    applies_to_modes: [self_managed, managed]
    order_index: 1
  - signal_key: auth_enabled
    question: "Is authentication (native realm, LDAP, SAML, or API key) required to access all Elasticsearch APIs?"
    input_type: toggle
    applies_to_modes: [self_managed, managed]
    order_index: 2
  - signal_key: rbac_enabled
    question: "Are Elasticsearch roles configured to restrict index access to minimum required users/services?"
    input_type: toggle
    applies_to_modes: [self_managed, managed]
    order_index: 3
  - signal_key: publicly_accessible
    question: "Is the Elasticsearch cluster accessible from the public internet?"
    input_type: radio
    applies_to_modes: [self_managed, managed]
    options:
      - { label: "No — private network only", value: "no" }
      - { label: "Yes — public with authentication", value: "yes_auth" }
      - { label: "Yes — open / no authentication", value: "yes_open" }
    order_index: 4
  - signal_key: encryption_at_rest
    question: "Is data-at-rest encryption enabled for Elasticsearch data and snapshot storage?"
    input_type: toggle
    applies_to_modes: [self_managed, managed]
    order_index: 5
  - signal_key: audit_logging
    question: "Is audit logging enabled to capture authentication, authorisation, and index-level access events?"
    input_type: toggle
    applies_to_modes: [self_managed, managed]
    order_index: 6
  - signal_key: backup_enabled
    question: "Are automated snapshot backups configured and tested for restoration?"
    input_type: toggle
    applies_to_modes: [self_managed, managed]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical Access Controls"
      severity: CRITICAL
      description: "The entity implements logical access security measures to protect information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: publicly_accessible, op: in, value: ["no", "yes_auth"] }
    evidence: "Authentication, RBAC, and network access controls ensure only authorised users can query Elasticsearch indices."
    remediation: "Enable TLS and native auth; create index-scoped roles; avoid public cluster exposure or enforce authentication with IP allowlisting."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.7"
      title: "Restricts Transmission of Confidential Information"
      severity: HIGH
      description: "The entity restricts the transmission of confidential information to authorised parties using encryption."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "TLS on HTTP and transport layers encrypts all data in transit, preventing eavesdropping on Elasticsearch traffic."
    remediation: "Enable xpack.security.transport.ssl and xpack.security.http.ssl with valid certificates."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.3"
      title: "Information Access Restriction"
      severity: HIGH
      description: "Access to information and application system functions shall be restricted in accordance with the access control policy."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: audit_logging, op: eq, value: "yes" }
    evidence: "Elasticsearch RBAC and audit logging enforce and record access restrictions at the index and operation level."
    remediation: "Define roles per service; enable audit logging for authentication_failed and access_denied events."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "3.5.1"
      title: "Encryption of Stored Cardholder Data"
      severity: CRITICAL
      description: "Primary account numbers are secured with strong cryptography for storage in the CDE."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: publicly_accessible, op: eq, value: "no" }
    evidence: "Encryption at rest, TLS, and private network access protect cardholder data indexed in Elasticsearch."
    remediation: "Enable Elastic stack encryption at rest; place cluster in a private subnet; disable any anonymous access."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Technical measures shall protect personal data against unauthorised access."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
        - { signal: publicly_accessible, op: in, value: ["no", "yes_auth"] }
    evidence: "Encrypted storage, mandatory authentication, and private network configuration protect personal data in search indices."
    remediation: "Enable encryption at rest; require authentication; document Elasticsearch in GDPR data map if it indexes personal data."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(2)(iv)"
      title: "Encryption and Decryption"
      severity: HIGH
      description: "Implement a mechanism to encrypt and decrypt electronic protected health information."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "At-rest encryption and TLS protect ePHI indexed in Elasticsearch both at storage and in transit."
    remediation: "Enable Elastic encryption at rest; configure TLS; restrict access to ePHI indices to clinical application roles only."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: auth_enabled, op: eq, value: "yes" }
    evidence: "Encrypted storage and authentication protect personal data of Nigerian residents indexed in Elasticsearch."
    remediation: "Enable encryption at rest and TLS; require authentication; restrict index access to service accounts by RBAC roles."
