slug: aws-s3
name: "AWS S3"
category: object-storage
vendor: "Amazon Web Services"
is_managed_available: true
logo_url: /logos/aws-s3.svg

config_questions:
  - signal_key: public_access_blocked
    question: "Is S3 Block Public Access enabled at the account or bucket level?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: encryption_at_rest
    question: "Is server-side encryption enabled on all buckets (SSE-S3, SSE-KMS, or DSSE-KMS)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 2
  - signal_key: versioning_enabled
    question: "Is S3 Versioning enabled to protect against accidental deletion?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: access_logging
    question: "Is S3 Server Access Logging or CloudTrail data events enabled?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: tls_enforced
    question: "Does the bucket policy deny requests without TLS (aws:SecureTransport)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: mfa_delete_enabled
    question: "Is MFA Delete enabled to prevent unrecoverable object deletion?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6
  - signal_key: lifecycle_policy
    question: "Are lifecycle policies configured to manage object retention and deletion?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical and Physical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security software and architectures over protected information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: public_access_blocked, op: eq, value: "yes" }
    evidence: "S3 Block Public Access prevents public exposure of objects storing sensitive data."
    remediation: "Enable Block Public Access at account level; audit all bucket ACLs and policies."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.7"
      title: "Restrictions on Information Transmission"
      severity: MEDIUM
      description: "The transmission and movement of information is limited to authorised users."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: encryption_at_rest, op: eq, value: "yes" }
    evidence: "Bucket policy denying non-TLS requests and SSE ensures data confidentiality in transit and at rest."
    remediation: "Add aws:SecureTransport deny condition to bucket policy; enable SSE-KMS with customer-managed key."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.2"
      title: "Evaluates Security Events"
      severity: MEDIUM
      description: "The entity monitors system components and the operation of those controls on an ongoing basis."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: access_logging, op: eq, value: "yes" }
    evidence: "S3 Server Access Logging and CloudTrail data events provide audit trail for all bucket operations."
    remediation: "Enable S3 Server Access Logging to a separate security-only bucket; enable CloudTrail S3 data events."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "SSE-KMS with CMK and TLS-enforced bucket policy satisfy data encryption requirements."
    remediation: "Use SSE-KMS with a customer-managed KMS key; enforce TLS via bucket policy."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.14"
      title: "Redundancy of Information Processing"
      severity: MEDIUM
      description: "Information processing facilities shall be implemented with sufficient redundancy."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: versioning_enabled, op: eq, value: "yes" }
    evidence: "S3 Versioning retains previous object versions enabling recovery from accidental deletion or corruption."
    remediation: "Enable versioning and configure lifecycle rules to transition/expire old versions cost-effectively."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical measures to ensure security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: public_access_blocked, op: eq, value: "yes" }
        - { signal: access_logging, op: eq, value: "yes" }
    evidence: "Encryption at rest, blocked public access, and audit logging implement GDPR Article 32 technical measures."
    remediation: "Enable SSE-KMS, Block Public Access, and S3 access logging for all buckets holding personal data."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.5(1)(e)"
      title: "Storage Limitation"
      severity: MEDIUM
      description: "Personal data shall be kept in a form which permits identification of data subjects for no longer than necessary."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: lifecycle_policy, op: eq, value: "yes" }
    evidence: "S3 Lifecycle policies enforce automatic deletion of personal data after retention period expires."
    remediation: "Define S3 Lifecycle rules that expire objects containing personal data after the documented retention period."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "Req.3.5"
      title: "Primary Account Number Protection"
      severity: CRITICAL
      description: "Primary account number must be secured wherever stored."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: public_access_blocked, op: eq, value: "yes" }
    evidence: "SSE-KMS and Block Public Access protect PAN stored in S3 from unauthorised access."
    remediation: "Use SSE-KMS with CMK; enable Block Public Access; restrict bucket policy to CDE systems only."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(2)(iv)"
      title: "Encryption and Decryption"
      severity: HIGH
      description: "Implement a mechanism to encrypt and decrypt electronic protected health information."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "SSE-KMS encrypts ePHI at rest; TLS-enforced bucket policy encrypts ePHI in transit."
    remediation: "Enable SSE-KMS with a CMK; add aws:SecureTransport deny condition to all buckets holding ePHI."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: encryption_at_rest, op: eq, value: "yes" }
        - { signal: public_access_blocked, op: eq, value: "yes" }
    evidence: "Encryption at rest and blocked public access safeguard personal data of Nigerian data subjects."
    remediation: "Enable SSE-KMS and Block Public Access on all buckets holding personal data of Nigerian residents."
