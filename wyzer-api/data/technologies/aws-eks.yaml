slug: aws-eks
name: "Amazon EKS"
category: container-runtime
vendor: "Amazon Web Services"
is_managed_available: true
logo_url: /logos/aws-eks.svg

config_questions:
  - signal_key: private_cluster
    question: "Is the EKS cluster endpoint private (no public API server endpoint enabled)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: rbac_enabled
    question: "Is Kubernetes RBAC configured with least-privilege roles and role bindings per namespace?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 2
  - signal_key: irsa_enabled
    question: "Are pods using IAM Roles for Service Accounts (IRSA) rather than node-level instance profiles?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: secrets_encrypted
    question: "Is envelope encryption for Kubernetes Secrets enabled using a KMS customer-managed key?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: network_policies
    question: "Are Kubernetes NetworkPolicies enforced by a CNI plugin (e.g., Calico, Cilium) to restrict pod-to-pod traffic?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: control_plane_logging
    question: "Are all EKS control plane log types (api, audit, authenticator, controllerManager, scheduler) sent to CloudWatch?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6
  - signal_key: managed_node_groups
    question: "Are worker nodes managed using EKS Managed Node Groups or Fargate profiles (no self-managed EC2 nodes)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 7
  - signal_key: pod_security_standards
    question: "Are Pod Security Standards (Restricted/Baseline) enforced using Pod Security Admission or OPA/Gatekeeper?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 8

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical Access Controls"
      severity: CRITICAL
      description: "The entity implements logical access security measures to protect information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: private_cluster, op: eq, value: "yes" }
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: irsa_enabled, op: eq, value: "yes" }
    evidence: "Private cluster endpoint, RBAC, and IRSA ensure least-privilege access to the control plane and cloud resources."
    remediation: "Disable public endpoint; configure RBAC per namespace; create IRSA service accounts for each workload."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.6"
      title: "Logical Access Security - External Threats"
      severity: HIGH
      description: "The entity implements controls to prevent unauthorised access from external sources."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: network_policies, op: eq, value: "yes" }
        - { signal: pod_security_standards, op: eq, value: "yes" }
    evidence: "NetworkPolicies and Pod Security Standards enforce perimeter controls within the cluster."
    remediation: "Install Calico or Cilium CNI; define default-deny NetworkPolicies; enforce Restricted pod security standard."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography including key management shall be implemented."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_encrypted, op: eq, value: "yes" }
    evidence: "EKS envelope encryption with a customer-managed KMS key protects Kubernetes Secrets at rest."
    remediation: "Enable envelope encryption on the cluster; create a dedicated KMS CMK; document key rotation schedule."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "7.2.1"
      title: "Access Control - Least Privilege"
      severity: CRITICAL
      description: "Access to system components and cardholder data is restricted to only those whose job requires it."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: irsa_enabled, op: eq, value: "yes" }
        - { signal: network_policies, op: eq, value: "yes" }
    evidence: "RBAC, IRSA, and NetworkPolicies together enforce least-privilege access for cardholder data workloads running in EKS."
    remediation: "Audit all ClusterRoles; replace wildcard permissions; define IRSA per microservice; restrict pod egress to CDE requirements."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Controllers shall implement appropriate technical measures to ensure a level of security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_encrypted, op: eq, value: "yes" }
        - { signal: private_cluster, op: eq, value: "yes" }
    evidence: "Encrypted Secrets and private endpoint ensure personal data processed in EKS workloads is protected at rest and in transit."
    remediation: "Enable KMS envelope encryption; disable public endpoint; review workload configurations for GDPR-sensitive data handling."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(1)"
      title: "Access Control"
      severity: CRITICAL
      description: "Implement technical policies and procedures for electronic information systems that allow access only to authorised persons."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: control_plane_logging, op: eq, value: "yes" }
        - { signal: secrets_encrypted, op: eq, value: "yes" }
    evidence: "RBAC access controls, full API audit logging, and encrypted secrets protect ePHI processed in EKS workloads."
    remediation: "Enable all control plane log types; configure RBAC for ePHI namespaces; extend HIPAA BAA to cover EKS usage."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_encrypted, op: eq, value: "yes" }
        - { signal: network_policies, op: eq, value: "yes" }
    evidence: "Encryption of Kubernetes Secrets and network isolation protect personal data of Nigerian residents running in EKS."
    remediation: "Enable envelope encryption; enforce NetworkPolicies in namespaces hosting Nigerian user data workloads."
