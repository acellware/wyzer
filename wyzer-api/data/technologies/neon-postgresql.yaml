slug: neon-postgresql
name: "Neon Postgres"
category: database
vendor: "Neon, Inc."
is_managed_available: true
logo_url: /logos/neon.svg

config_questions:
  - signal_key: tls_enforced
    question: "Is TLS required for all client connections to Neon (sslmode=require or verify-full)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: connection_pooling
    question: "Is PgBouncer connection pooling enabled to reduce attack surface from direct connection strings?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 2
  - signal_key: branching_used
    question: "Are Neon database branches used for development/staging rather than connecting to production?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: role_least_privilege
    question: "Are PostgreSQL roles created with least-privilege privileges (no superuser for application accounts)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: ip_allowlist
    question: "Is IP allowlisting configured to restrict which clients can connect to the Neon project endpoint?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: pitr_enabled
    question: "Is Point-in-Time Recovery (PITR) enabled with an appropriate retention window?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6
  - signal_key: secrets_rotated
    question: "Are database credentials rotated regularly and stored in a secrets manager rather than in application configs?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security measures to protect information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: role_least_privilege, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "Least-privilege PostgreSQL roles and mandatory TLS enforce access control on Neon managed PostgreSQL."
    remediation: "Create application-specific roles with GRANT on required schemas; set sslmode=require; revoke public schema access."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "A1.2"
      title: "Availability - Backup and Recovery"
      severity: MEDIUM
      description: "Environmental protections include backup and recovery capabilities."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: pitr_enabled, op: eq, value: "yes" }
    evidence: "Neon PITR functionality enables recovery to any point within the retention window."
    remediation: "Enable PITR for production branches; configure sufficient retention window (7+ days); document RTO/RPO."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.3"
      title: "Information Access Restriction"
      severity: HIGH
      description: "Access to information and application system functions shall be restricted in accordance with the access control policy."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: role_least_privilege, op: eq, value: "yes" }
        - { signal: ip_allowlist, op: eq, value: "yes" }
    evidence: "PostgreSQL RBAC and IP allowlisting restrict access to the minimum required principals and source networks."
    remediation: "Create per-environment roles; configure IP allowlisting on the Neon project; document in access control matrix."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "3.5.1"
      title: "Encryption of Stored Cardholder Data"
      severity: CRITICAL
      description: "Primary account numbers are secured with strong cryptography for storage."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: role_least_privilege, op: eq, value: "yes" }
    evidence: "Neon managed postgres uses encryption at rest by default; TLS enforces transport encryption for CDE data."
    remediation: "Set sslmode=verify-full; create CDE-specific roles; use Neon branching to keep CDE separate from dev."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Technical measures shall protect personal data from unauthorised access."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: role_least_privilege, op: eq, value: "yes" }
        - { signal: secrets_rotated, op: eq, value: "yes" }
    evidence: "Mandatory TLS, least-privilege roles, and credential rotation protect personal data stored in Neon PostgreSQL."
    remediation: "Enforce sslmode=require; rotate credentials quarterly; document Neon as a data processor in GDPR records."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(2)(iv)"
      title: "Encryption and Decryption"
      severity: HIGH
      description: "Implement a mechanism to encrypt and decrypt electronic protected health information."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: role_least_privilege, op: eq, value: "yes" }
    evidence: "TLS for transit and Neon's built-in encryption at rest protect ePHI stored in Neon PostgreSQL databases."
    remediation: "Confirm Neon HIPAA BAA; set sslmode=verify-full; never branch ePHI databases into non-production environments."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: MEDIUM
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: tls_enforced, op: eq, value: "yes" }
        - { signal: role_least_privilege, op: eq, value: "yes" }
    evidence: "TLS and PostgreSQL RBAC protect personal data of Nigerian residents stored in Neon managed databases."
    remediation: "Enforce TLS; create dedicated application roles; do not share production branches with development teams."
