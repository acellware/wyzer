slug: datadog
name: "Datadog"
category: observability
vendor: "Datadog, Inc."
is_managed_available: true
logo_url: /logos/datadog.svg

config_questions:
  - signal_key: sensitive_data_scanner
    question: "Is the Datadog Sensitive Data Scanner enabled to redact PII from logs and traces?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: role_based_access
    question: "Are Datadog RBAC roles configured with least-privilege access per team?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 2
  - signal_key: audit_trail
    question: "Is the Datadog Audit Trail enabled to log all user and API actions?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: api_key_rotation
    question: "Are Datadog API keys rotated regularly and scoped to specific services?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: log_retention_configured
    question: "Is log retention configured to match your compliance data retention policy?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: alerts_on_anomalies
    question: "Are security anomaly monitors and alerts configured (failed logins, privilege escalation)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.2"
      title: "Evaluates Security Events"
      severity: HIGH
      description: "The entity monitors system components and the operation of those controls on an ongoing basis."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: alerts_on_anomalies, op: eq, value: "yes" }
    evidence: "Datadog monitors and alerts provide continuous security event detection across the infrastructure."
    remediation: "Configure monitors for auth failures, resource saturation, and deployment anomalies; route alerts to PagerDuty/Slack."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.3"
      title: "Evaluates Security Events - Response"
      severity: MEDIUM
      description: "The entity evaluates security events to determine whether they could or have resulted in a failure."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: audit_trail, op: eq, value: "yes" }
    evidence: "Datadog Audit Trail provides an immutable log of all operator and API actions for incident investigation."
    remediation: "Enable Audit Trail; retain for at least 90 days; review weekly for anomalous access patterns."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.3"
      title: "Information Access Restriction"
      severity: MEDIUM
      description: "Access to information and application system functions shall be restricted in accordance with the access control policy."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: role_based_access, op: eq, value: "yes" }
    evidence: "Datadog RBAC restricts access to dashboards, logs, and configurations per team role."
    remediation: "Define Datadog roles per team (read-only, editor); use SAML SSO for identity federation."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical measures to ensure security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: sensitive_data_scanner, op: eq, value: "yes" }
        - { signal: log_retention_configured, op: eq, value: "yes" }
    evidence: "Sensitive Data Scanner prevents PII leakage into logs; configured retention enforces storage limitation."
    remediation: "Enable Sensitive Data Scanner with PII rules; set log retention to match documented data retention policy."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(b)"
      title: "Audit Controls"
      severity: HIGH
      description: "Implement hardware, software, and procedural mechanisms that record and examine activity in information systems."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: audit_trail, op: eq, value: "yes" }
        - { signal: sensitive_data_scanner, op: eq, value: "yes" }
    evidence: "Audit Trail records all system access; Sensitive Data Scanner prevents ePHI from persisting in log pipelines."
    remediation: "Enable Audit Trail and Sensitive Data Scanner; configure HIPAA-specific redaction rules for log pipelines."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: MEDIUM
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: sensitive_data_scanner, op: eq, value: "yes" }
    evidence: "Sensitive Data Scanner prevents personal data of Nigerian residents from persisting unredacted in Datadog."
    remediation: "Enable Sensitive Data Scanner with rules covering Nigerian ID numbers, phone numbers, and PII field patterns."
