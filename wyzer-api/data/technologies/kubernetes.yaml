slug: kubernetes
name: Kubernetes
category: container-runtime
vendor: "Cloud Native Computing Foundation"
is_managed_available: true
logo_url: /logos/kubernetes.svg

config_questions:
  - signal_key: rbac_enabled
    question: "Is RBAC enabled on the cluster?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 1
  - signal_key: network_policies_enabled
    question: "Are Kubernetes NetworkPolicies defined to restrict pod-to-pod traffic?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 2
  - signal_key: pod_security_standards
    question: "Which Pod Security Standard is enforced?"
    input_type: radio
    applies_to_modes: [managed, self-hosted, on-prem]
    options:
      - { value: none, label: "None" }
      - { value: privileged, label: "Privileged (no restrictions)" }
      - { value: baseline, label: "Baseline" }
      - { value: restricted, label: "Restricted (recommended)" }
    order_index: 3
  - signal_key: secrets_encrypted
    question: "Are Kubernetes Secrets encrypted at rest (etcd encryption)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 4
  - signal_key: audit_logging
    question: "Is Kubernetes API server audit logging enabled?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 5
  - signal_key: tls_enforced
    question: "Is TLS enforced for all API server communications?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 6
  - signal_key: image_scanning
    question: "Are container images scanned for vulnerabilities before deployment?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 7
  - signal_key: private_cluster
    question: "Is the API server endpoint private (not publicly accessible)?"
    input_type: toggle
    applies_to_modes: [managed, self-hosted, on-prem]
    order_index: 8

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical and Physical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security software and architectures over protected information assets."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
    evidence: "Kubernetes RBAC restricts access to API resources via Role and ClusterRole bindings."
    remediation: "Enable RBAC with --authorization-mode=RBAC; define least-privilege Roles per workload."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.6"
      title: "Logical Access - External Threats"
      severity: HIGH
      description: "Logical access security measures restrict access from outside the system boundary."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: private_cluster, op: eq, value: "yes" }
        - { signal: network_policies_enabled, op: eq, value: "yes" }
    evidence: "Private API server endpoint and NetworkPolicies limit blast radius from external threats."
    remediation: "Enable private cluster endpoint; define default-deny NetworkPolicy with explicit allow rules."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC7.2"
      title: "Evaluates Security Events"
      severity: MEDIUM
      description: "The entity monitors system components and the operation of those controls on an ongoing basis."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: audit_logging, op: eq, value: "yes" }
    evidence: "API server audit logs provide a record of all actions taken against cluster resources."
    remediation: "Enable audit policy at RequestResponse level; ship logs to a SIEM."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.3"
      title: "Information Access Restriction"
      severity: HIGH
      description: "Access to information and application system functions shall be restricted in accordance with the access control policy."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: pod_security_standards, op: "in", value: ["baseline", "restricted"] }
    evidence: "RBAC and Pod Security Standards together enforce least-privilege access at API and workload level."
    remediation: "Define namespace-scoped Roles; enforce at least Baseline Pod Security Standard via admission."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_encrypted, op: eq, value: "yes" }
        - { signal: tls_enforced, op: eq, value: "yes" }
    evidence: "etcd encryption at rest and mutual TLS for API communications satisfy cryptography requirements."
    remediation: "Configure EncryptionConfiguration for etcd; use cert-manager for certificate lifecycle management."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical measures to ensure security appropriate to the risk including encryption of personal data."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: secrets_encrypted, op: eq, value: "yes" }
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: network_policies_enabled, op: eq, value: "yes" }
    evidence: "Encrypted secrets, RBAC, and network isolation collectively protect personal data processed in cluster workloads."
    remediation: "Enable etcd encryption, namespace-scoped RBAC, and default-deny NetworkPolicies."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "Req.7"
      title: "Restrict Access to System Components and Cardholder Data"
      severity: HIGH
      description: "Limit access to system components and cardholder data to only those individuals whose job requires such access."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: network_policies_enabled, op: eq, value: "yes" }
    evidence: "RBAC and NetworkPolicies enforce need-to-know access for cardholder data environment workloads."
    remediation: "Segment cardholder data workloads into dedicated namespaces with strict RBAC and NetworkPolicies."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(1)"
      title: "Access Control"
      severity: HIGH
      description: "Implement technical policies and procedures for electronic information systems to allow access only to those authorised."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: rbac_enabled, op: eq, value: "yes" }
        - { signal: private_cluster, op: eq, value: "yes" }
    evidence: "RBAC and private cluster endpoint restrict ePHI workloads to authorised personnel only."
    remediation: "Audit all ClusterRoleBindings; use private GKE/EKS endpoint for clusters processing ePHI."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: HIGH
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: false
      rules:
        - { signal: secrets_encrypted, op: eq, value: "yes" }
        - { signal: rbac_enabled, op: eq, value: "yes" }
    evidence: "Encrypted secrets and RBAC protect personal data of Nigerian data subjects processed in cluster workloads."
    remediation: "Enable etcd encryption and restrict cluster access via RBAC to authorised operators."
