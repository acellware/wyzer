slug: aws-secrets-manager
name: "AWS Secrets Manager"
category: secrets-management
vendor: "Amazon Web Services"
is_managed_available: true
logo_url: /logos/aws-secrets-manager.svg

config_questions:
  - signal_key: automatic_rotation
    question: "Is automatic secret rotation enabled for all secrets (database credentials, API keys)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: rotation_interval_days
    question: "How frequently are secrets rotated automatically?"
    input_type: radio
    applies_to_modes: [managed]
    options:
      - { label: "Every 30 days or less", value: "30" }
      - { label: "Every 60 days", value: "60" }
      - { label: "Every 90 days", value: "90" }
      - { label: "Not rotated automatically", value: "none" }
    order_index: 2
  - signal_key: kms_encryption
    question: "Are secrets encrypted using a customer-managed KMS key (CMK)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: access_policy_least_privilege
    question: "Are IAM resource-based policies on secrets scoped to the minimum required principals?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: no_cross_account_access
    question: "Is cross-account access to secrets disabled or explicitly restricted?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: secrets_not_in_env_vars
    question: "Are application secrets fetched from Secrets Manager at runtime rather than stored in environment variables?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6
  - signal_key: cloudtrail_logging
    question: "Is AWS CloudTrail logging enabled and configured to capture all Secrets Manager API calls?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical and Physical Access Controls"
      severity: CRITICAL
      description: "The entity implements logical access security software, infrastructure, and architectures over protected information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: kms_encryption, op: eq, value: "yes" }
        - { signal: access_policy_least_privilege, op: eq, value: "yes" }
    evidence: "Secrets encrypted with CMK and IAM policies ensure only authorised principals can access secrets."
    remediation: "Enable CMK encryption for all secrets; audit IAM resource policies; remove wildcard principals."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.7"
      title: "Restricts Transmission of Confidential Information"
      severity: HIGH
      description: "The entity restricts the transmission of confidential information to authorised parties."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_not_in_env_vars, op: eq, value: "yes" }
        - { signal: no_cross_account_access, op: eq, value: "yes" }
    evidence: "Runtime secret retrieval prevents credentials from being exposed in container metadata or environment variables."
    remediation: "Refactor applications to call GetSecretValue at runtime; remove all secrets from .env files and task definitions."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.24"
      title: "Use of Cryptography"
      severity: HIGH
      description: "Rules for the effective use of cryptography, including cryptographic key management, shall be defined and implemented."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: kms_encryption, op: eq, value: "yes" }
        - { signal: automatic_rotation, op: eq, value: "yes" }
    evidence: "Customer-managed KMS keys with automatic rotation satisfy cryptographic key lifecycle management requirements."
    remediation: "Create a CMK with annual rotation enabled; update Secrets Manager to use CMK; document key management procedure."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "8.3.2"
      title: "Strong Authentication for User Access"
      severity: CRITICAL
      description: "Strong cryptography is used to safeguard all individual non-consumer user authentication factors during transmission and storage."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: automatic_rotation, op: eq, value: "yes" }
        - { signal: rotation_interval_days, op: in, value: ["30", "60"] }
        - { signal: kms_encryption, op: eq, value: "yes" }
    evidence: "Automatic rotation with CMK encryption ensures credentials in the CDE are cryptographically protected and regularly cycled."
    remediation: "Enable automatic rotation at 30–60 day intervals for all CDE credentials; use CMK for encryption."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: kms_encryption, op: eq, value: "yes" }
        - { signal: access_policy_least_privilege, op: eq, value: "yes" }
    evidence: "Encrypted secrets with least-privilege policies protect authentication credentials used to access personal data stores."
    remediation: "Audit secrets that grant access to databases containing personal data; apply CMK encryption and tight resource policies."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(2)(iv)"
      title: "Encryption and Decryption"
      severity: HIGH
      description: "Implement a mechanism to encrypt and decrypt electronic protected health information."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: kms_encryption, op: eq, value: "yes" }
        - { signal: cloudtrail_logging, op: eq, value: "yes" }
    evidence: "CMK encryption on Secrets Manager and CloudTrail audit logs satisfy ePHI credential protection and access audit requirements."
    remediation: "Ensure all secrets scoping ePHI workloads use CMK; enable CloudTrail data events for secretsmanager.*."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: MEDIUM
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: kms_encryption, op: eq, value: "yes" }
        - { signal: automatic_rotation, op: eq, value: "yes" }
    evidence: "Encrypted, regularly-rotated credentials protect access to Nigerian resident data stored in downstream systems."
    remediation: "Apply CMK encryption and enable rotation for all secrets that control access to personal data of Nigerian residents."
