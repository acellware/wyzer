slug: aws-ecs
name: "Amazon ECS"
category: container-runtime
vendor: "Amazon Web Services"
is_managed_available: true
logo_url: /logos/aws-ecs.svg

config_questions:
  - signal_key: fargate_only
    question: "Are tasks running on AWS Fargate rather than self-managed EC2 container instances?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 1
  - signal_key: task_role_least_privilege
    question: "Does each ECS task definition have a dedicated IAM task role with least-privilege policies?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 2
  - signal_key: secrets_from_secrets_manager
    question: "Are secrets injected into containers via AWS Secrets Manager or SSM Parameter Store references (not plaintext env vars)?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 3
  - signal_key: readonly_root_filesystem
    question: "Are container task definitions configured with readonlyRootFilesystem = true?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 4
  - signal_key: network_mode_awsvpc
    question: "Are tasks using awsvpc network mode with private subnets and security groups?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 5
  - signal_key: cloudwatch_logging
    question: "Is the awslogs driver configured to forward container stdout/stderr to CloudWatch Logs?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 6
  - signal_key: no_privileged_containers
    question: "Are all containers configured with privileged = false in task definitions?"
    input_type: toggle
    applies_to_modes: [managed]
    order_index: 7

control_mappings:
  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.1"
      title: "Logical Access Controls"
      severity: HIGH
      description: "The entity implements logical access security measures to protect information assets."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: task_role_least_privilege, op: eq, value: "yes" }
        - { signal: secrets_from_secrets_manager, op: eq, value: "yes" }
    evidence: "Per-task IAM roles and secrets from Secrets Manager ensure containers have minimal permissions with no embedded credentials."
    remediation: "Create dedicated IAM task roles per service; reference secrets using the secrets key in task definition, not env."

  - framework:
      slug: soc2
      name: "SOC 2 Type II"
    control:
      ref: "CC6.6"
      title: "Logical Access Security - External Threats"
      severity: HIGH
      description: "Logical access security software prevents or detects introduction of unauthorised software."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: no_privileged_containers, op: eq, value: "yes" }
        - { signal: readonly_root_filesystem, op: eq, value: "yes" }
    evidence: "Non-privileged containers with read-only filesystems limit the blast radius of container compromise."
    remediation: "Set privileged=false and readonlyRootFilesystem=true in all task definitions; mount tmpfs for writable paths."

  - framework:
      slug: iso27001
      name: "ISO/IEC 27001:2022"
    control:
      ref: "A.8.9"
      title: "Configuration Management"
      severity: HIGH
      description: "Configurations of hardware, software, services, and networks shall be established, documented, monitored, and reviewed."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: network_mode_awsvpc, op: eq, value: "yes" }
        - { signal: cloudwatch_logging, op: eq, value: "yes" }
    evidence: "awsvpc network isolation and CloudWatch log forwarding ensure ECS network configurations are controlled and observable."
    remediation: "Ensure all services use awsvpc; configure awslogs log driver; set log retention policies in CloudWatch."

  - framework:
      slug: pci-dss
      name: "PCI-DSS v4.0"
    control:
      ref: "7.2.1"
      title: "Access Control - Least Privilege"
      severity: CRITICAL
      description: "Access to system components and cardholder data is restricted to only those whose job requires it."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: task_role_least_privilege, op: eq, value: "yes" }
        - { signal: secrets_from_secrets_manager, op: eq, value: "yes" }
        - { signal: no_privileged_containers, op: eq, value: "yes" }
    evidence: "Least-privilege task roles, Secrets Manager integration, and non-privileged containers restrict CDE access."
    remediation: "Audit all task IAM policies; deny wildcard actions; use separate task roles per microservice in the CDE."

  - framework:
      slug: gdpr
      name: "GDPR"
    control:
      ref: "Art.32"
      title: "Security of Processing"
      severity: HIGH
      description: "Technical measures shall protect personal data from unauthorised processing."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_from_secrets_manager, op: eq, value: "yes" }
        - { signal: network_mode_awsvpc, op: eq, value: "yes" }
    evidence: "Secrets Manager references and network isolation prevent personal data credentials from being exposed or sniffed."
    remediation: "Review task definitions for hardcoded credentials; ensure all personal data containers run in private subnets."

  - framework:
      slug: hipaa
      name: "HIPAA"
    control:
      ref: "164.312(a)(1)"
      title: "Access Control"
      severity: HIGH
      description: "Implement technical policies and procedures that allow access only to authorised persons."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: task_role_least_privilege, op: eq, value: "yes" }
        - { signal: cloudwatch_logging, op: eq, value: "yes" }
    evidence: "Least-privilege task roles and CloudWatch logs provide access control and auditability for ePHI workloads."
    remediation: "Define HIPAA-scoped task roles; enable CloudWatch Logs for ePHI services; set log retention to 6 years."

  - framework:
      slug: ndpr
      name: "NDPR"
    control:
      ref: "Art.2.6"
      title: "Data Security"
      severity: MEDIUM
      description: "Adequate technical measures shall be employed to safeguard personal data."
    conditions:
      logic: AND
      managed_auto_pass: true
      rules:
        - { signal: secrets_from_secrets_manager, op: eq, value: "yes" }
        - { signal: no_privileged_containers, op: eq, value: "yes" }
    evidence: "Secure credential injection and non-privileged containers protect personal data of Nigerian residents processed by ECS tasks."
    remediation: "Remove plaintext credentials; set privileged=false; run Nigerian user data services in private-subnet tasks."
