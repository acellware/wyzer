name: Deploy wyzer-api

on:
 push:
  branches:
   - main # → production
   - staging # → staging
  paths:
   - "wyzer-api/**"
   - ".github/workflows/deploy-api.yml"

jobs:
 deploy:
  name: Deploy to Fly.io
  runs-on: ubuntu-latest
  timeout-minutes: 15

  steps:
   - name: Checkout
     uses: actions/checkout@v4

   - name: Set up Fly CLI
     uses: superfly/flyctl-actions/setup-flyctl@master

   - name: Deploy to staging
     if: github.ref == 'refs/heads/staging'
     working-directory: wyzer-api
     run: flyctl deploy --config fly.staging.toml --app wyzer-api-staging --remote-only
     env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

   - name: Deploy to production
     if: github.ref == 'refs/heads/main'
     working-directory: wyzer-api
     run: flyctl deploy --config fly.toml --app wyzer-api-prod --remote-only
     env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
