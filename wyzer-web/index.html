<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)" />
  <title>Wyzer · Compliance intelligence for your stack</title>

  <!-- Constant social tags (per-route title/description/url are set at runtime) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wyzer" />
  <meta property="og:image" content="https://wyzer.acellhq.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://wyzer.acellhq.com/og.png" />

  <!-- Fonts (loaded async so they don't block first paint; display=swap avoids FOIT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
   rel="preload"
   as="style"
   href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..400&family=JetBrains+Mono:wght@400;500&display=swap"
   onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
   <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
   />
  </noscript>
 </head>
 <body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
 </body>
</html>
