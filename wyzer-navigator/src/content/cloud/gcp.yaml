providerName: Google Cloud
blurb: Google's cloud platform.
order: 3
categories:
  - slug: storage
    name: Storage
    blurb: Object storage and disks.
    resources:
      - slug: cloud-storage
        name: Cloud Storage
        blurb: Object storage buckets.
        configurations:
          - slug: public-access
            name: Public Access
            topic: object-storage-public-access
            providerNote: Controlled by Public Access Prevention.
          - slug: encryption-at-rest
            name: Encryption at Rest
            topic: encryption-at-rest
            providerNote: Google-managed keys by default, or CMEK.
          - slug: backup-retention
            name: Backup & Retention
            topic: backup-and-retention
            providerNote: Object versioning and retention policy.
  - slug: compute
    name: Compute
    blurb: Virtual machines and disks.
    resources:
      - slug: compute-engine
        name: Compute Engine
        blurb: Virtual machines.
        configurations:
          - slug: public-exposure
            name: Public Exposure
            topic: compute-public-exposure
            providerNote: External IP plus firewall rules.
          - slug: disk-encryption
            name: Disk Encryption
            topic: encryption-at-rest
            providerNote: CMEK on persistent disks.
  - slug: database
    name: Database
    blurb: Managed databases.
    resources:
      - slug: cloud-sql
        name: Cloud SQL
        blurb: Managed relational databases.
        configurations:
          - slug: public-ip
            name: Public IP
            topic: database-public-access
            providerNote: Public IP plus authorized networks.
          - slug: encryption-at-rest
            name: Encryption at Rest
            topic: encryption-at-rest
            providerNote: Google-managed keys or CMEK.
          - slug: tls-in-transit
            name: TLS in Transit
            topic: data-in-transit-encryption
            providerNote: Require SSL/TLS for connections.
          - slug: backups-retention
            name: Backups & Retention
            topic: backup-and-retention
            providerNote: Automated backups and point-in-time recovery.
  - slug: networking
    name: Networking
    blurb: Network access rules.
    resources:
